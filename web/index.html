  <!-- Firebase SDK pro push notifikace -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getMessaging, getToken, onMessage } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js';

    const firebaseConfig = {
      apiKey: "AIzaSyCp2it9pVTSSvUVqK9m70hxJ0Q_7qKz-8A",
      authDomain: "spiderbagzz.firebaseapp.com",
      projectId: "spiderbagzz",
      storageBucket: "spiderbagzz.firebasestorage.app",
      messagingSenderId: "700570202812",
      appId: "1:700570202812:web:71e6b3df01815714f996b9"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    // Register FCM service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then((registration) => {
          console.log('[FCM] Service Worker registered:', registration.scope);
        })
        .catch((error) => {
          console.error('[FCM] Service Worker registration failed:', error);
        });
    }

    // Expose functions to Dart
    window.requestNotificationPermission = async function() {
      try {
        const permission = await Notification.requestPermission();
        return permission;
      } catch (e) {
        console.error('[FCM] Permission error:', e);
        return 'denied';
      }
    };

    window.getFCMToken = async function(vapidKey) {
      try {
        const token = await getToken(messaging, { vapidKey: vapidKey });
        console.log('[FCM] Token:', token);
        return token;
      } catch (e) {
        console.error('[FCM] Token error:', e);
        return null;
      }
    };

    window.getNotificationPermission = function() {
      return Notification.permission;
    };

    // Handle foreground messages
    onMessage(messaging, (payload) => {
      console.log('[FCM] Foreground message:', payload);

      // Show notification manually for foreground
      if (Notification.permission === 'granted') {
        new Notification(payload.notification?.title || 'SpiderBagzz', {
          body: payload.notification?.body || '',
          icon: '/icons/Icon-192.png',
          badge: '/icons/Icon-192.png',
          tag: payload.data?.tag || 'foreground',
          data: payload.data
        });
      }

      // Dispatch custom event for Flutter to catch
      window.dispatchEvent(new CustomEvent('fcm-message', { detail: payload }));
    });
  </script>

  <!-- Custom styles for loading -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0D1B2A;
      overflow: hidden;
    }

    /* Loading screen */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, #0D1B2A 0%, #1C3148 50%, #0D1B2A 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #loading img {
      width: 150px;
      height: 150px;
      animation: pulse 2s ease-in-out infinite;
    }

    #loading .spinner {
      margin-top: 30px;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(196, 30, 36, 0.3);
      border-top-color: #C41E24;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    #loading .text {
      margin-top: 20px;
      color: #F5F0E6;
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      opacity: 0.7;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading">
    <img src="icons/Icon-512.png" alt="SpiderBagzz">
    <div class="spinner"></div>
    <div class="text">Nacitam...</div>
  </div>

  <script>
    // Remove loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.transition = 'opacity 0.3s';
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 300);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
