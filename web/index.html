  <!-- Firebase SDK pro push notifikace -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getMessaging, getToken, onMessage } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAV3W6DuCbCyZZDo5LWkwrSUUER4qZzhJI",
      authDomain: "charlottes-web-app.firebaseapp.com",
      projectId: "charlottes-web-app",
      storageBucket: "charlottes-web-app.firebasestorage.app",
      messagingSenderId: "66173275380",
      appId: "1:66173275380:web:ec9c80a5a0679b9d1be2a1"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    // Register FCM service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then((registration) => {
          console.log('[FCM] Service Worker registered:', registration.scope);
        })
        .catch((error) => {
          console.error('[FCM] Service Worker registration failed:', error);
        });
    }

    // Expose functions to Dart
    window.requestNotificationPermission = async function() {
      try {
        const permission = await Notification.requestPermission();
        return permission;
      } catch (e) {
        console.error('[FCM] Permission error:', e);
        return 'denied';
      }
    };

    window.getFCMToken = async function(vapidKey) {
      try {
        const token = await getToken(messaging, { vapidKey: vapidKey });
        console.log('[FCM] Token:', token);
        return token;
      } catch (e) {
        console.error('[FCM] Token error:', e);
        return null;
      }
    };

    window.getNotificationPermission = function() {
      return Notification.permission;
    };

    // Handle foreground messages
    onMessage(messaging, (payload) => {
      console.log('[FCM] Foreground message:', payload);
      // Notifikace se zobrazuje automaticky pres FCM, nemusime ji zobrazovat manualne
      // Dispatch custom event for Flutter to catch
      window.dispatchEvent(new CustomEvent('fcm-message', { detail: payload }));
    });
  </script>

  <!-- Custom styles for loading -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0A0A0F;
      overflow: hidden;
    }

    /* Loading screen - Functional Dark theme */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0A0A0F;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #loading img {
      width: 150px;
      height: 150px;
      animation: pulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.5));
    }

    #loading .spinner {
      margin-top: 30px;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 212, 255, 0.2);
      border-top-color: #00D4FF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    #loading .text {
      margin-top: 20px;
      color: #8B8B8B;
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading">
    <img src="icons/Icon-512.png" alt="Charlotte's Web">
    <div class="spinner"></div>
    <div class="text">Inicializace...</div>
  </div>

  <script>
    // Remove loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.transition = 'opacity 0.3s';
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 300);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
